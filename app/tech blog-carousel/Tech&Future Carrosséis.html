<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech&Future — Sistema de Carrosseis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    #root { height: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel">

  /* ── Base brand tokens ──────────────────────────────────── */
  const ink = '#0D0D0B', cream = '#F4F0E8', paper = '#EDE8DC';
  const wg = '#C8C3B8', muted = '#7A7670', el = '#C9FF47';
  const syne = "'Syne', sans-serif";
  const cor  = "'Cormorant Garamond', serif";
  const mono = "'DM Mono', monospace";

  /* ── ÂMBAR palette ──────────────────────────────────────── */
  const AMB  = '#C26000';   // burnt amber accent
  const ABKG = '#F5F0E8';   // warm cream bg (shares with cream)
  const APP  = '#EDE6D4';   // amber paper

  /* ── NOITE palette ──────────────────────────────────────── */
  const NMD  = '#080D1A';   // midnight bg
  const NNV  = '#0F1830';   // navy panel
  const NBL  = '#4080FF';   // electric blue accent
  const NSK  = '#C8D8FF';   // sky text

  /* ── TERRA palette ──────────────────────────────────────── */
  const TBR  = '#1E110A';   // dark brown bg
  const TOC  = '#F0E4C0';   // ochre cream text/panel
  const TGD  = '#D4920A';   // warm gold accent
  const TPL  = '#2A1810';   // panel dark

  /* ── Shared primitives ──────────────────────────────────── */
  function Slide({ bg = ink, p = 28, children }) {
    return (
      <div style={{
        width: '100%', height: '100%', background: bg, padding: p,
        display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
        overflow: 'hidden', boxSizing: 'border-box',
      }}>{children}</div>
    );
  }
  function Meta({ color = muted, align = 'left', size = '9px', w = 300, children }) {
    return (
      <span style={{
        fontFamily: mono, fontSize: size, fontWeight: w, letterSpacing: '0.18em',
        textTransform: 'uppercase', color, display: 'block', textAlign: align, lineHeight: 1.6,
      }}>{children}</span>
    );
  }
  function Rule({ color = wg, mt = 0, mb = 0, h = 1 }) {
    return <div style={{ width: '100%', height: h, background: color, flexShrink: 0, marginTop: mt, marginBottom: mb }} />;
  }
  function MRow({ left, right, lc = muted, rc = muted }) {
    return (
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Meta color={lc}>{left}</Meta>
        <Meta color={rc} align="right">{right}</Meta>
      </div>
    );
  }
  function Disp({ size = 62, color = cream, lh = 0.9, children }) {
    return (
      <div style={{ fontFamily: syne, fontSize: size, fontWeight: 800, color, lineHeight: lh, letterSpacing: '-0.04em', textTransform: 'uppercase' }}>
        {children}
      </div>
    );
  }
  function Body({ size = 13, color = cream, italic = false, lh = 1.75, children }) {
    return (
      <div style={{ fontFamily: cor, fontSize: size, fontWeight: 300, color, fontStyle: italic ? 'italic' : 'normal', lineHeight: lh }}>
        {children}
      </div>
    );
  }

  /* ══════════════════════════════════════════════════════════
     TEMPLATE A — MANCHETE  ·  dark · Syne bold · electric
  ══════════════════════════════════════════════════════════ */
  function A1() {
    return (
      <Slide bg={ink}>
        <MRow left="T&F — IA &amp; TRABALHO" right="JUN 2026" />
        <Disp size={62}>O FIM<br />DOS<br />PROGRA-<br />MADORES?</Disp>
        <div><Rule color={el} mb={10} /><MRow left="Nº 001 — ANÁLISE" right="01 — 05" rc={el} /></div>
      </Slide>
    );
  }
  function A2() {
    return (
      <Slide bg={ink}>
        <MRow left="DADO" right="02 — 05" rc={el} />
        <div>
          <div style={{ fontFamily: syne, fontSize: 96, fontWeight: 800, color: el, lineHeight: 1, letterSpacing: '-0.04em' }}>74%</div>
          <div style={{ height: 12 }} />
          <Body size={14} italic={true}>dos desenvolvedores já usam<br />assistentes de IA no workflow<br />diário — GitHub Survey, 2025.</Body>
        </div>
        <div><Rule color={wg} mb={10} /><Meta>Fonte: GitHub Developer Survey 2025</Meta></div>
      </Slide>
    );
  }
  function A3() {
    return (
      <Slide bg={ink}>
        <MRow left="PERSPECTIVA" right="03 — 05" rc={el} />
        <div>
          <div style={{ fontFamily: mono, fontSize: 48, fontWeight: 300, color: el, lineHeight: 1, marginBottom: 14 }}>"</div>
          <Body size={16} italic={true} lh={1.6}>Em cinco anos, escrever código<br />manualmente será como datilografar:<br />uma habilidade admirável,<br />não uma necessidade de mercado.</Body>
          <div style={{ height: 16 }} />
          <Rule color={wg} mb={12} />
          <Meta>LUCAS VERDE — CTO, DATALAB BRASIL</Meta>
        </div>
        <div />
      </Slide>
    );
  }
  function A4() {
    const items = [
      ['01', 'Cursor & Devin', 'Agentes que escrevem, revisam e deployam código de forma autônoma.'],
      ['02', 'Code Review por IA', 'Revisão semântica e de segurança automatizada no CI/CD.'],
      ['03', 'Dev como arquiteto', 'O papel muda: menos digitação, mais tomada de decisão sistêmica.'],
    ];
    return (
      <Slide bg={ink}>
        <MRow left="O QUE VEM POR AÍ" right="04 — 05" rc={el} />
        <Rule color={wg} mt={12} mb={18} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          {items.map(([n, t, d]) => (
            <div key={n} style={{ display: 'flex', gap: 12 }}>
              <Meta color={el} size="9px">{n} —</Meta>
              <div>
                <div style={{ fontFamily: syne, fontSize: 12, fontWeight: 700, color: cream, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{t}</div>
                <div style={{ fontFamily: cor, fontSize: 12, fontWeight: 300, color: muted, lineHeight: 1.55, marginTop: 3 }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
        <div />
      </Slide>
    );
  }
  function A5() {
    return (
      <Slide bg={el} p={28}>
        <Meta color={ink}>LEIA A ANÁLISE COMPLETA →</Meta>
        <div>
          <div style={{ fontFamily: syne, fontSize: 58, fontWeight: 800, color: ink, lineHeight: 0.88, letterSpacing: '-0.04em', textTransform: 'uppercase' }}>TECH<br />&amp;FUTURE</div>
          <div style={{ height: 16 }} />
          <div style={{ fontFamily: mono, fontSize: 10, fontWeight: 400, color: ink, letterSpacing: '0.14em', textTransform: 'uppercase' }}>techandfuture.com.br</div>
        </div>
        <div><Rule color={ink} mb={10} /><Meta color={ink}>@techandfuture — SIGA PARA MAIS ANÁLISES</Meta></div>
      </Slide>
    );
  }

  /* ══════════════════════════════════════════════════════════
     TEMPLATE B — IMPRESSO  ·  cream · editorial print
  ══════════════════════════════════════════════════════════ */
  function B1() {
    return (
      <Slide bg={cream}>
        <div>
          <Rule color={ink} mb={8} />
          <MRow left="TECH &amp; FUTURE" right="JUN 2026 — Nº 002" lc={ink} rc={muted} />
          <Rule color={ink} mt={8} mb={22} />
          <Disp size={52} color={ink}>SUPERIN-<br />TELIGÊN-<br />CIA:</Disp>
          <div style={{ fontFamily: syne, fontSize: 24, fontWeight: 700, color: ink, lineHeight: 1.1, letterSpacing: '-0.02em', marginTop: 6 }}>2027 ou 2040?</div>
        </div>
        <div>
          <Rule color={wg} mb={10} />
          <Body size={12} italic={true} color={muted} lh={1.6}>A corrida que vai redefinir o poder global — e ninguém sabe quando termina.</Body>
          <div style={{ height: 10 }} />
          <Meta align="right" color={muted}>01 — 05</Meta>
        </div>
      </Slide>
    );
  }
  function B2() {
    return (
      <Slide bg={cream}>
        <div>
          <MRow left="CONTEXTO" right="02 — 05" lc={ink} rc={muted} />
          <Rule color={wg} mt={10} mb={16} />
          <Disp size={30} color={ink} lh={1.0}>QUEM FAZ<br />A APOSTA?</Disp>
        </div>
        <div>
          <Body size={13} color={ink}>OpenAI, DeepMind e Anthropic convergem para uma previsão: sistemas com raciocínio equivalente ao humano em tarefas cognitivas entre 2027 e 2032.</Body>
          <div style={{ height: 12 }} />
          <Body size={13} color={ink}>Sam Altman afirmou que "a AGI pode chegar antes do que o mundo está pronto para aceitar." Jensen Huang, da NVIDIA, vai além: "estamos a 5 anos de uma IA que supera qualquer profissional humano."</Body>
        </div>
        <Rule color={wg} />
      </Slide>
    );
  }
  function B3() {
    return (
      <Slide bg={paper}>
        <MRow left="CITAÇÃO" right="03 — 05" lc={muted} rc={muted} />
        <div>
          <div style={{ fontFamily: mono, fontSize: 40, fontWeight: 300, color: wg, lineHeight: 1, marginBottom: 10 }}>"</div>
          <Body size={18} italic={true} color={ink} lh={1.55}>A AGI é o maior evento da história da humanidade — se chegarmos lá. E eu acredito que chegaremos.</Body>
        </div>
        <div>
          <Rule color={wg} mb={12} />
          <MRow left="ILYA SUTSKEVER" right="CO-FUNDADOR, OPENAI" lc={ink} rc={muted} />
        </div>
      </Slide>
    );
  }
  function B4() {
    const rows = [
      ['2022', 'ChatGPT inaugura a era dos LLMs públicos', false],
      ['2024', 'GPT-4o une linguagem, visão e voz em tempo real', false],
      ['2025', 'Modelos de raciocínio (o1, Gemini) chegam ao mercado', false],
      ['2027?', 'AGI — previsão oficial do OpenAI', true],
    ];
    return (
      <Slide bg={cream}>
        <MRow left="LINHA DO TEMPO" right="04 — 05" lc={ink} rc={muted} />
        <Rule color={wg} mt={10} mb={14} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
          {rows.map(([y, e, ac]) => (
            <div key={y} style={{ display: 'flex', gap: 14, alignItems: 'baseline', padding: '10px 0', borderBottom: `1px solid ${wg}` }}>
              <span style={{ fontFamily: mono, fontSize: 9, color: ac ? ink : muted, letterSpacing: '0.15em', flexShrink: 0, fontWeight: ac ? 400 : 300 }}>{y}</span>
              <span style={{ fontFamily: cor, fontSize: 13, fontWeight: 300, fontStyle: ac ? 'italic' : 'normal', color: ink, lineHeight: 1.4 }}>{e}</span>
            </div>
          ))}
        </div>
        <div><div style={{ height: 12 }} /><Meta color={muted}>Projeções sujeitas a revisão contínua</Meta></div>
      </Slide>
    );
  }
  function B5() {
    return (
      <Slide bg={ink}>
        <Meta color={muted}>CONTINUA EM →</Meta>
        <div>
          <Rule color={wg} mb={20} />
          <Disp size={50} color={cream}>TECH<br />&amp;FUTURE</Disp>
          <div style={{ height: 18 }} />
          <Meta color={muted} size="10px">techandfuture.com.br</Meta>
        </div>
        <div><Rule color={wg} mb={10} /><Meta color={wg}>@techandfuture — análises semanais</Meta></div>
      </Slide>
    );
  }

  /* ══════════════════════════════════════════════════════════
     TEMPLATE C — DADOS  ·  alternante dark/light · números
  ══════════════════════════════════════════════════════════ */
  function C1() {
    return (
      <Slide bg={cream}>
        <MRow left="INFOGRÁFICO — SEMICONDUTORES" right="01 — 05" lc={muted} rc={muted} />
        <div>
          <Disp size={68} color={ink}>$ 1,2T</Disp>
          <div style={{ height: 10 }} />
          <Body size={12} italic={true} color={muted}>em investimentos em chips<br />previstos até 2030 — globais.</Body>
        </div>
        <div>
          <Rule color={wg} mb={12} />
          <div style={{ fontFamily: syne, fontSize: 18, fontWeight: 800, color: ink, letterSpacing: '-0.02em', textTransform: 'uppercase' }}>A GUERRA DOS CHIPS</div>
          <div style={{ height: 6 }} />
          <Meta color={muted}>EUA × CHINA × TAIWAN — geopolítica da IA</Meta>
        </div>
      </Slide>
    );
  }
  function C2() {
    return (
      <Slide bg={ink}>
        <MRow left="COMPARAÇÃO" right="02 — 05" rc={el} />
        <Rule color={wg} mt={12} mb={20} />
        <div style={{ display: 'flex', gap: 20, flex: 1 }}>
          <div style={{ flex: 1 }}>
            <Meta color={wg}>EUA</Meta>
            <div style={{ fontFamily: syne, fontSize: 44, fontWeight: 800, color: cream, lineHeight: 0.9, letterSpacing: '-0.04em', marginTop: 8 }}>$52B</div>
            <div style={{ height: 8 }} />
            <Meta color={muted}>investimento público<br />CHIPS Act (2022–30)</Meta>
          </div>
          <div style={{ width: 1, background: wg, flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <Meta color={wg}>CHINA</Meta>
            <div style={{ fontFamily: syne, fontSize: 44, fontWeight: 800, color: el, lineHeight: 0.9, letterSpacing: '-0.04em', marginTop: 8 }}>$143B</div>
            <div style={{ height: 8 }} />
            <Meta color={muted}>fundo estatal de<br />semicondutores 2024–30</Meta>
          </div>
        </div>
        <div><Rule color={wg} mt={16} mb={10} /><Meta>Valores em USD · CSIS, SEMI, 2025</Meta></div>
      </Slide>
    );
  }
  function C3() {
    return (
      <Slide bg={cream}>
        <MRow left="FATO-CHAVE" right="03 — 05" lc={ink} rc={muted} />
        <div>
          <Disp size={88} color={ink}>83%</Disp>
          <div style={{ height: 14 }} />
          <Body size={13} italic={true} color={ink} lh={1.65}>dos chips de IA de última geração<br />são fabricados pela TSMC, em Taiwan<br />— o maior gargalo geopolítico<br />da tecnologia moderna.</Body>
        </div>
        <div><Rule color={wg} mb={10} /><Meta color={muted}>Fonte: SIA — Semiconductor Industry Association, 2025</Meta></div>
      </Slide>
    );
  }
  function C4() {
    return (
      <Slide bg={paper}>
        <MRow left="ANÁLISE" right="04 — 05" lc={muted} rc={muted} />
        <div>
          <Disp size={30} color={ink} lh={1.0}>TAIWAN:<br />O PARADOXO</Disp>
          <div style={{ height: 14 }} />
          <Body size={13} color={ink}>Taiwan fabrica o que o mundo não consegue fabricar em outro lugar. A TSMC representa uma concentração de risco sem precedentes na história industrial: uma única ilha que sustenta todo o ecossistema global de IA.</Body>
          <div style={{ height: 12 }} />
          <Body size={13} color={ink}>EUA e UE tentam replicar essa capacidade com bilhões em subsídios. Prazo estimado para igualar a TSMC: mais de 10 anos.</Body>
        </div>
        <Rule color={wg} />
      </Slide>
    );
  }
  function C5() {
    const pts = [
      ['Concentração', 'A hegemonia tecnológica depende de uma ilha de 36 mil km².'],
      ['Corrida', 'EUA e China investem trilhões, mas a vantagem da TSMC é de décadas.'],
      ['Risco sistêmico', 'Qualquer tensão no Estreito afeta a IA global imediatamente.'],
    ];
    return (
      <Slide bg={ink}>
        <MRow left="3 TAKEAWAYS" right="05 — 05" rc={el} />
        <Rule color={wg} mt={12} mb={18} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
          {pts.map(([l, t]) => (
            <div key={l} style={{ display: 'flex', gap: 12 }}>
              <span style={{ fontFamily: mono, fontSize: 9, color: el, letterSpacing: '0.1em', flexShrink: 0, paddingTop: 1 }}>→</span>
              <div>
                <span style={{ fontFamily: mono, fontSize: 9, color: cream, letterSpacing: '0.14em', textTransform: 'uppercase' }}>{l} — </span>
                <span style={{ fontFamily: cor, fontSize: 12, fontWeight: 300, color: muted, lineHeight: 1.6 }}>{t}</span>
              </div>
            </div>
          ))}
        </div>
        <div><Rule color={wg} mt={18} mb={12} /><MRow left="@techandfuture" right="SIGA PARA MAIS" rc={el} /></div>
      </Slide>
    );
  }

  /* ══════════════════════════════════════════════════════════
     ELEMENTOS  ·  componentes reutilizáveis isolados
  ══════════════════════════════════════════════════════════ */

  /* — Headers — */
  function EL_H1() { /* Manchete: dark masthead */
    return (
      <Slide bg={ink}>
        <div>
          <Rule color={el} mb={10} />
          <MRow left="TECH &amp; FUTURE" right="JUN 2026 — Nº 001" lc={cream} rc={muted} />
          <Rule color={wg} mt={10} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, opacity: 0.18 }}>
          {[1,2,3,4,5].map(i => <div key={i} style={{ height: 8, background: wg, width: `${85 - i*10}%` }} />)}
        </div>
        <div>
          <Rule color={wg} mb={10} />
          <Meta color={muted}>← HEADER MANCHETE — FUNDO ESCURO</Meta>
        </div>
      </Slide>
    );
  }
  function EL_H2() { /* Impresso: double rule editorial */
    return (
      <Slide bg={cream}>
        <div>
          <Rule color={ink} mb={6} />
          <Rule color={ink} mb={8} h={3} />
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', paddingBottom: 8, borderBottom: `1px solid ${wg}` }}>
            <div style={{ fontFamily: syne, fontSize: 13, fontWeight: 800, color: ink, letterSpacing: '0.08em', textTransform: 'uppercase' }}>TECH &amp; FUTURE</div>
            <Meta color={muted}>TECNOLOGIA — IA — SOCIEDADE</Meta>
            <Meta color={muted} align="right">JUN 2026</Meta>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, opacity: 0.15 }}>
          {[1,2,3,4,5].map(i => <div key={i} style={{ height: 8, background: ink, width: `${85 - i*10}%` }} />)}
        </div>
        <div>
          <Rule color={wg} mb={10} />
          <Meta color={muted}>← HEADER IMPRESSO — FUNDO CLARO</Meta>
        </div>
      </Slide>
    );
  }
  function EL_H3() { /* Minimal: brand mark + category */
    return (
      <Slide bg={cream}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
          <div style={{ fontFamily: syne, fontSize: 28, fontWeight: 800, color: ink, lineHeight: 1, letterSpacing: '-0.03em' }}>T&amp;F</div>
          <div style={{ textAlign: 'right' }}>
            <Meta color={ink} align="right">IA &amp; TRABALHO</Meta>
            <Meta color={muted} align="right">JUN 2026</Meta>
          </div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, opacity: 0.15 }}>
          {[1,2,3,4,5].map(i => <div key={i} style={{ height: 8, background: ink, width: `${85 - i*10}%` }} />)}
        </div>
        <div>
          <Rule color={wg} mb={10} />
          <Meta color={muted}>← HEADER MINIMALISTA</Meta>
        </div>
      </Slide>
    );
  }

  /* — Citações — */
  function EL_Q1() { /* Dark: large quote mark */
    return (
      <Slide bg={ink}>
        <Meta color={muted}>CITAÇÃO — ESCURO</Meta>
        <div>
          <div style={{ fontFamily: mono, fontSize: 52, fontWeight: 300, color: el, lineHeight: 1, marginBottom: 14 }}>"</div>
          <Body size={16} italic={true} lh={1.6}>A tecnologia mais transformadora é aquela que deixa de ser percebida como tecnologia.</Body>
          <div style={{ height: 16 }} />
          <Rule color={wg} mb={12} />
          <Meta>KEVIN KELLY — CO-FUNDADOR, WIRED</Meta>
        </div>
        <div />
      </Slide>
    );
  }
  function EL_Q2() { /* Light: left border */
    return (
      <Slide bg={cream}>
        <Meta color={muted}>CITAÇÃO — COM BORDA</Meta>
        <div style={{ display: 'flex', gap: 16 }}>
          <div style={{ width: 3, background: AMB, flexShrink: 0 }} />
          <div>
            <Body size={17} italic={true} color={ink} lh={1.6}>Não estamos construindo ferramentas. Estamos criando a próxima camada da civilização.</Body>
            <div style={{ height: 16 }} />
            <Meta color={muted}>DEMIS HASSABIS — CEO, GOOGLE DEEPMIND</Meta>
          </div>
        </div>
        <Rule color={wg} />
      </Slide>
    );
  }
  function EL_Q3() { /* Paper: oversized bg punctuation */
    return (
      <Slide bg={paper}>
        <Meta color={muted}>CITAÇÃO — PAPEL</Meta>
        <div style={{ position: 'relative' }}>
          <div style={{ fontFamily: cor, fontSize: 120, fontWeight: 300, fontStyle: 'italic', color: wg, lineHeight: 0.8, position: 'absolute', top: -10, left: -8, zIndex: 0, userSelect: 'none' }}>"</div>
          <div style={{ position: 'relative', zIndex: 1, paddingTop: 28 }}>
            <Body size={17} italic={true} color={ink} lh={1.6}>A melhor interface de IA é aquela que você usa sem perceber que está usando IA.</Body>
          </div>
        </div>
        <div>
          <Rule color={wg} mb={12} />
          <MRow left="SAM ALTMAN" right="CEO, OPENAI" lc={ink} rc={muted} />
