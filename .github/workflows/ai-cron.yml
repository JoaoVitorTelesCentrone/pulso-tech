name: AI Article Generator

on:
  schedule:
    - cron: '*/5 * * * *' # Teste: a cada 5 minutos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Required Secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          missing=0
          for name in DEEPSEEK_API_KEY KIMI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BREVO_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing secret::$name is not configured in GitHub Actions secrets"
              missing=1
            fi
          done
          exit $missing

      - name: Generate AI Articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SEND_ARTICLE_EMAILS: 'false'
        run: npx tsx scripts/generate-article.ts

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ -n "$(git status --porcelain content/articles public/images data/history.json data/summaries data/slides data/carousels data/daily-summaries)" ]]; then
            git add content/articles/ public/images/ data/history.json data/summaries/ data/slides/ data/carousels/ data/daily-summaries/
            git commit -m "Auto-generated AI articles"
            git push
            echo "Articles committed successfully."
          else
            echo "No new articles to commit."
          fi

      - name: Wait for Published Articles
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/wait-for-generated-publication.ts

      - name: Send Generated Article Emails
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npx tsx scripts/send-generated-notifications.ts
