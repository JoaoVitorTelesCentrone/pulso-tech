name: AI Article Generator

on:
  schedule:
    - cron: '0 9 * * *'   # 06:00 BRT
    - cron: '0 11 * * *'  # 08:00 BRT
    - cron: '0 13 * * *'  # 10:00 BRT
    - cron: '0 15 * * *'  # 12:00 BRT
    - cron: '0 17 * * *'  # 14:00 BRT
    - cron: '0 19 * * *'  # 16:00 BRT
    - cron: '0 21 * * *'  # 18:00 BRT
    - cron: '0 23 * * *'  # 20:00 BRT
    - cron: '0 1 * * *'   # 22:00 BRT
    - cron: '0 3 * * *'   # 00:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate AI Articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tsx scripts/generate-article.ts

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ -n "$(git status --porcelain)" ]]; then
            git add content/articles/ public/images/ data/history.json data/summaries/ data/slides/ data/carousels/
            git commit -m "🤖 Auto-generated AI articles [skip ci]"
            git push
            echo "✅ Artigos commitados com sucesso."
          else
            echo "⚠️ Nenhuma notícia nova. Nada a commitar."
          fi
